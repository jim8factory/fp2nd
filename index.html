<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FP 2日目ヒアリング（CSV読み込み）</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  pre { white-space: pre-wrap; border:1px solid #ccc; padding:10px; }
  .block { margin-top:20px; }
</style>
</head>
<body>

<h1>2日目ヒアリング（CSV読み込み）</h1>

<div class="block">
  <h3>1日目のCSVを読み込む</h3>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="loadCSV()">読み込み</button>
</div>

<div class="block">
  <h3>相談者データ（1日目）</h3>
  <pre id="day1data">CSVを読み込むとここに表示されます</pre>
</div>

<div class="block">
  <h3>追加ヒアリング（2日目）</h3>
  <label>前回からの変化・補足:
    <textarea id="add1" style="width:100%;height:80px;"></textarea>
  </label>
  <label>FP側の確認事項:
    <textarea id="add2" style="width:100%;height:80px;"></textarea>
  </label>
  <label>最終プラン方針（FP記入）:
    <textarea id="add3" style="width:100%;height:120px;"></textarea>
  </label>
  <button onclick="exportDay2()">2日目データをCSV出力</button>
</div>

<script>
function loadCSV() {
  const file = document.getElementById("csvFile").files[0];
  if (!file) { alert("CSVを選択してください"); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    document.getElementById("day1data").textContent = text;
  };
  reader.readAsText(file, "UTF-8");
}

function exportDay2() {
  const d1 = document.getElementById("day1data").textContent;
  const a1 = document.getElementById("add1").value.replace(/\n/g," ");
  const a2 = document.getElementById("add2").value.replace(/\n/g," ");
  const a3 = document.getElementById("add3").value.replace(/\n/g," ");

  const rows = [
    ["--- 1日目データ ---"],
    [d1],
    ["--- 2日目追加 ---"],
    ["前回からの変化・補足", a1],
    ["FP確認事項", a2],
    ["最終プラン方針", a3]
  ];

  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "fp_day2.csv";
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
