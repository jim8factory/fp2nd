<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FP 2日目プランニング（AI案込み）</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  pre { white-space: pre-wrap; border:1px solid #ccc; padding:10px; }
  textarea { width:100%; height:120px; }
  .block { margin-top:20px; }
</style>
</head>
<body>

<h1>2日目：AIプランニング＋FP最終案</h1>

<!-- CSV読み込み -->
<div class="block">
  <h3>1日目CSV読み込み</h3>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="loadCSV()">読み込む</button>
</div>

<!-- 1日目データ表示 -->
<div class="block">
  <h3>1日目ヒアリング内容</h3>
  <pre id="day1data">CSVを読み込むと表示されます</pre>
</div>

<!-- AIプランニング案 -->
<div class="block">
  <h3>AIプランニング案（自動生成）</h3>
  <pre id="autoMemo">CSV読み込み後に自動生成されます</pre>
</div>

<!-- FP編集欄 -->
<div class="block">
  <h3>FP最終プランニング（編集）</h3>
  <textarea id="fpEdit" placeholder="FPが最終調整を書く欄"></textarea>
  <button onclick="exportFinal()">最終CSV出力</button>
</div>

<script>
// CSV読み込み
function loadCSV() {
  const file = csvFile.files[0];
  if (!file) { alert("CSVを選択してください"); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    day1data.textContent = text;

    // CSV → オブジェクト化
    const lines = text.split("\n").map(l => l.split(","));
    const obj = {};
    lines.forEach(row => {
      if (row.length >= 2) obj[row[0]] = row[1];
    });

    // AIプランニング案生成
    autoMemo.textContent = generatePlanningMemo(obj);
  };
  reader.readAsText(file, "UTF-8");
}

// AIプランニング案生成
function generatePlanningMemo(d) {
  let m = "";
  m += "【AIプランニング案（自動生成）】\n\n";

  m += "■現状の把握\n";
  m += `家族構成：${d["家族構成"] || ""}\n`;
  m += `居住：${d["居住形態"] || ""}\n`;
  m += `勤務：${d["勤務形態"] || ""}\n`;
  m += `月収：${d["月収"] || ""}／固定費：${d["固定費"] || ""}\n`;
  m += `貯蓄：${d["貯蓄"] || ""}／投資：${d["投資"] || ""}\n\n`;

  m += "■相談者の希望・優先度\n";
  m += `ライフイベント：${d["ライフイベント"] || ""}\n`;
  m += `優先事項：${d["優先したいこと"] || ""}\n`;
  m += `不安・こだわり：${d["不安・こだわり"] || ""}\n\n`;

  m += "■AI初期プランニング方針\n";
  m += "・キャッシュフローの健全性を確認し、優先度の高いイベントから資金計画を作成\n";
  m += "・保険・投資・住宅ローンの見直し余地を確認\n";
  m += "・相談者の不安を解消するため、リスク許容度に合わせた提案を準備\n";
  m += "・次回面談で具体的な数値シミュレーションを提示\n";

  return m;
}

// 最終CSV出力
function exportFinal() {
  const finalMemo = fpEdit.value.replace(/\n/g, " ");
  const auto = autoMemo.textContent.replace(/\n/g, " ");

  const rows = [
    ["--- 1日目データ ---"],
    [day1data.textContent.replace(/\n/g, " ")],
    ["--- AIプランニング案 ---"],
    [auto],
    ["--- FP最終プランニング ---"],
    [finalMemo]
  ];

  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "fp_final_plan.csv";
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
