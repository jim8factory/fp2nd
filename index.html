<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FP 2日目プランニング（AI案＋FP入力）</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  pre { white-space: pre-wrap; border:1px solid #ccc; padding:10px; }
  textarea { width:100%; height:100px; }
  .block { margin-top:20px; }
</style>
</head>
<body>

<h1>2日目：AIプランニング＋FPヒアリング＋最終案</h1>

<!-- CSV読み込み -->
<div class="block">
  <h3>1日目CSV読み込み</h3>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="loadCSV()">読み込む</button>
</div>

<!-- 1日目データ表示 -->
<div class="block">
  <h3>1日目ヒアリング内容</h3>
  <pre id="day1data">CSVを読み込むと表示されます</pre>
</div>

<!-- AIプランニング案 -->
<div class="block">
  <h3>AIプランニング案（自動生成）</h3>
  <pre id="autoMemo">CSV読み込み後に自動生成されます</pre>
</div>

<!-- 2日目ヒアリング項目 -->
<div class="block">
  <h3>2日目ヒアリング（FPが相談者に確認）</h3>

  <label>前回からの変化・追加情報:
    <textarea id="change"></textarea>
  </label>

  <label>住宅（購入時期・予算・ローン方針）:
    <textarea id="housePlan"></textarea>
  </label>

  <label>教育資金（進路の希望・時期）:
    <textarea id="eduPlan"></textarea>
  </label>

  <label>老後資金（生活費の希望・退職時期）:
    <textarea id="retirePlan"></textarea>
  </label>

  <label>保険の見直し（不要・不足・過剰）:
    <textarea id="insPlan"></textarea>
  </label>

  <label>投資方針（リスク許容度・期間）:
    <textarea id="invPlan"></textarea>
  </label>
</div>

<!-- FP最終案 -->
<div class="block">
  <h3>FP最終プランニング（FPがまとめる）</h3>
  <textarea id="fpEdit" placeholder="FPが最終調整を書く欄"></textarea>
  <button onclick="exportFinal()">最終CSV出力</button>
</div>

<script>
// CSV読み込み
function loadCSV() {
  const file = csvFile.files[0];
  if (!file) { alert("CSVを選択してください"); return; }

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    day1data.textContent = text;

    const lines = text.split("\n").map(l => l.split(","));
    const obj = {};
    lines.forEach(row => {
      if (row.length >= 2) obj[row[0]] = row[1];
    });

    autoMemo.textContent = aiPlanningEngine(obj) + "\n\n" + aiLifeEventSimulation(obj);
  };
  reader.readAsText(file, "UTF-8");
}

// AIプランニング案生成
function aiPlanningEngine(d) {
  let plan = "";

  plan += "【AIプランニング（FP自動分析）】\n\n";

  const income = Number(d["月収"] || 0);
  const fixed = Number(d["固定費"] || 0);
  const cf = income - fixed;

  plan += "■キャッシュフロー診断\n";
  plan += `月収：${income}円\n固定費：${fixed}円\n余剰：${cf}円\n`;
  if (cf < 30000) plan += "→ 余剰が少ないため、固定費の見直しが必要です。\n";
  else plan += "→ 余剰は確保されており、貯蓄・投資の余力があります。\n\n";

  plan += "■ライフイベント分析\n";
  plan += `${d["ライフイベント"] || "未入力"}\n`;
  plan += "→ 時期・金額の仮設定を次回行います。\n\n";

  plan += "■保険診断\n";
  plan += `${d["保険"] || "未入力"}\n`;
  plan += "→ 過不足の可能性を次回チェックします。\n\n";

  plan += "■投資方針\n";
  plan += `${d["投資"] || "未入力"}\n`;
  plan += "→ リスク許容度に合わせて最適化します。\n\n";

  plan += "■FPが次に行う作業\n";
  plan += "・ライフイベントの時系列化\n";
  plan += "・必要資金の試算\n";
  plan += "・キャッシュフロー表の作成\n";
  plan += "・保険・投資・住宅の最適化案\n";

  return plan;
}

// AIライフイベント試算
function aiLifeEventSimulation(d) {
  let sim = "【AIライフイベント試算】\n\n";

  sim += "■住宅資金（仮試算）\n";
  sim += "・予算：3000万〜4500万\n";
  sim += "・ローン返済：月8万〜12万\n\n";

  sim += "■教育資金（仮試算）\n";
  sim += "・幼稚園〜高校：総額500万〜700万\n";
  sim += "・大学（私立文系）：総額400万〜600万\n";
  sim += "・大学（私立理系）：総額600万〜900万\n\n";

  sim += "■老後資金（仮試算）\n";
  sim += "・生活費：月25万〜30万\n";
  sim += "・退職後30年：900万〜1080万\n";

  return sim;
}

// 最終CSV出力
function exportFinal() {
  const rows = [
    ["--- 1日目データ ---"],
    [day1data.textContent.replace(/\n/g, " ")],

    ["--- AIプランニング案 ---"],
    [autoMemo.textContent.replace(/\n/g, " ")],

    ["--- 2日目ヒアリング ---"],
    ["前回からの変化", change.value.replace(/\n/g, " ")],
    ["住宅", housePlan.value.replace(/\n/g, " ")],
    ["教育資金", eduPlan.value.replace(/\n/g, " ")],
    ["老後資金", retirePlan.value.replace(/\n/g, " ")],
    ["保険見直し", insPlan.value.replace(/\n/g, " ")],
    ["投資方針", invPlan.value.replace(/\n/g, " ")],

    ["--- FP最終プランニング ---"],
    [fpEdit.value.replace(/\n/g, " ")]
  ];

  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "fp_final_plan.csv";
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
